name: conversion-pulse

services:
    pgsql:
        image: postgres:17-alpine
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-pulse}'
            POSTGRES_USER: '${DB_USERNAME:-pulse}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-pulse}'
        volumes:
            - pgsql-data:/var/lib/postgresql/data
            - ./docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-q',
                    '-d',
                    '${DB_DATABASE:-pulse}',
                    '-U',
                    '${DB_USERNAME:-pulse}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgsql-data:
    redis-data:
