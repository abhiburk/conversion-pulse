name: deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 82.25.125.246
  DEPLOY_PORT: '65002'
  DEPLOY_USER: u286134684
  DEPLOY_PATH: domains/pulse.abhiburk.com/app

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pulse.abhiburk.com

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The Wayfinder Vite plugin runs artisan during the build, so the build needs a bootable app.
      - name: Build assets
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          rm .env

      # Host keys are public; pinning them here means a server that presents any other key is refused.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/known_hosts <<'KEYS'
          [82.25.125.246]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH3Fq4VNPBK/tWYSWOuEVWkzBvYAxxOTn1YvZ6YtQ2hK
          [82.25.125.246]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBM9X3rueXCPfi4S6JQPR8xnVuwWUFQU00proezQwBHXdS3E54R2IfXQePLH1b2az589vS4OB6DqlGjQU3nlglPQ=
          [82.25.125.246]:65002 ssh-rsa 
          KEYS
          printf 'Host production\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_USER" > ~/.ssh/config

      - name: Enter maintenance mode
        run: ssh production "cd $DEPLOY_PATH && php artisan down --retry=15"

      # The server's .env, SQLite database, storage and vendor directory are excluded, so --delete never touches them.
      - name: Upload code and assets
        run: |
          rsync -az --delete \
            --exclude=/.env \
            --exclude=/.git/ \
            --exclude=/.github/ \
            --exclude=/node_modules/ \
            --exclude=/vendor/ \
            --exclude=/storage/ \
            --exclude=/database/database.sqlite \
            --exclude='/bootstrap/cache/*.php' \
            --exclude=/public/storage \
            --exclude=/tests/ \
            ./ production:$DEPLOY_PATH/

      - name: Install, migrate and cache
        run: |
          ssh production "cd $DEPLOY_PATH && \
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress && \
            php artisan migrate --force && \
            php artisan optimize && \
            php artisan queue:restart && \
            php artisan up"

      - name: Leave maintenance mode after a failed deploy
        if: failure()
        run: ssh production "cd $DEPLOY_PATH && php artisan up" || true

      - name: Smoke test
        run: curl --fail --silent --show-error --output /dev/null https://pulse.abhiburk.com/up
